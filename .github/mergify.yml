# A green pull request merges when the maintainer approves it, or by the label
# `automerge`. Dependabot's patch and minor updates need only the green checks.
queue_rules:
  - name: default
    merge_method: squash
    queue_conditions:
      - "check-success=test"
      - "check-success=plugin (ubuntu-latest)"
      - "check-success=plugin (macos-latest)"
      - "check-success=secrets"
      - "#changes-requested-reviews-by=0"
      - -draft
      - or:
          - "#approved-reviews-by>=1"
          - label=automerge
          - and:
              - author=dependabot[bot]
              - dependabot-update-type!=version-update:semver-major

pull_request_rules:
  - name: Queue a pull request that is ready
    conditions: []
    actions:
      queue:
        name: default
  - name: Delete the branch after the merge
    conditions:
      - merged
    actions:
      delete_head_branch: {}
