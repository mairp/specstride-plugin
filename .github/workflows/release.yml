name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run e2e
      - run: npm run build:plugin
      - run: tar czf specstride-plugin-${GITHUB_REF_NAME}.tgz -C dist .
      - run: gh release create "$GITHUB_REF_NAME" specstride-plugin-*.tgz --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
