# A bundled descriptor of the product (origin `bundled`, read by the logical
# name `package:harness:example-anthropic-messages`). Data only: the address
# is the loopback the consumer replaces with its own; no account, no model,
# no gateway and no name specific to one machine. Removing this file changes
# no code (F109-FR-023).
descriptorVersion: 1
id: example-anthropic-messages
displayName: Example Anthropic-compatible messages endpoint
kind: anthropic-messages
detect:
  variables:
    - EXAMPLE_ENDPOINT_URL
provider:
  id: example-anthropic-messages
  termsRef: null
auth:
  tiers: [1, 2]
  credential: env:EXAMPLE_ENDPOINT_KEY
  scheme: x-api-key
endpoint:
  baseUrl: http://127.0.0.1:0
  chatPath: /v1/messages
  modelsPath: /v1/models
models:
  selection: declared
  default: example-model
roles:
  completion:
    supported: true
  critic:
    supported: true
stream:
  format: jsonl
continuation:
  supported: false
failures: {}
cost:
  class: metered
isolation:
  envAllow: []
memory:
  native: false
telemetry:
  off:
    env:
      DO_NOT_TRACK: "1"
containment:
  ceiling: C1
