# A bundled descriptor of the product (origin `bundled`, read by the logical
# name `package:harness:example-cli`). Data only: no path, no account, no
# model, no gateway and no name specific to one machine. Removing this file
# changes no code (F109-FR-023).
descriptorVersion: 1
id: example-cli
displayName: Example command-line harness
kind: cli
detect:
  executable: example-cli
  version:
    arg: --version
models:
  selection: declared
  default: example-model
roles:
  proposer:
    supported: true
  critic:
    supported: true
invoke:
  proposer:
    permission: none
    prompt: file
    args:
      - "--model"
      - "{model}"
      - "--workdir"
      - "{workdir}"
      - "--session"
      - "{sessionId}"
      - "--prompt-file"
      - "{promptFile}"
    files:
      harness.json: "harness: example-cli"
  critic:
    permission: none
    prompt: stdin
    args:
      - "--model"
      - "{model}"
      - "--prompt-stdin"
stream:
  format: text
continuation:
  supported: false
failures: {}
cost:
  class: local
isolation:
  envAllow: []
memory:
  native: false
telemetry:
  off:
    env:
      DO_NOT_TRACK: "1"
containment:
  ceiling: C1
