# The Loki configuration of the shipped telemetry stack (F128-FR-045, B-2450).
#
# No authentication (the `auth_enabled` switch is off); logs are kept for
# 168 hours (7 days); ingestion is limited to 16 MB per second with a burst of
# 32 MB.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # Logs are kept for 168 hours (7 days).
  retention_period: 168h
  # Ingestion is limited to 16 MB per second with a burst of 32 MB.
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32

ruler:
  alertmanager_url: http://localhost:9093

# A compactor that applies the retention above.
compactor:
  working_directory: /loki/compactor
  deletion_mode: disabled
